# Compila l'app Android ogni volta che il sito o l'app cambiano.
# Due versioni, stessa firma e stesso numero di versione (versionCode = numero della compilazione, sempre crescente):
#  - "github": Radici.apk con aggiornamento automatico. Dal ramo main finisce nella pagina "Releases".
#  - "store":  Radici-store.aab per Google Play, senza aggiornamento automatico. Si scarica dagli artifact
#              della compilazione (Actions → la compilazione → "Radici-aab-per-Google-Play").
# Sugli altri rami compila soltanto (verifica), senza pubblicare nulla.
name: App Android

on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'seed.js'
      - 'icone.js'
      - 'manifest.webmanifest'
      - '*.png'
      - 'app-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RADICI_KEY_PASSWORD: ${{ secrets.RADICI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Crea la chiave di firma (solo la prima volta)
        if: env.RADICI_KEY_PASSWORD != '' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f app-android/firma-app.p12 ]; then
            keytool -genkeypair -storetype PKCS12 -keystore app-android/firma-app.p12 -alias radici \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$RADICI_KEY_PASSWORD" -keypass "$RADICI_KEY_PASSWORD" \
              -dname "CN=Radici, O=Radici, C=IT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-android/firma-app.p12
            git commit -m "Chiave di firma dell'app, cifrata con la password segreta [skip ci]"
            git push
          fi

      - name: Impronte della firma (servono a Firebase per l'accesso con Google)
        if: env.RADICI_KEY_PASSWORD != ''
        run: |
          keytool -list -v -keystore app-android/firma-app.p12 -storetype PKCS12 -storepass "$RADICI_KEY_PASSWORD" | grep -E "SHA1:|SHA256:" | tee impronte.txt
          { echo "### Impronte della firma dell'app"; echo '```'; cat impronte.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepara l'app (copia il sito dentro l'app)
        working-directory: app-android
        run: |
          npm ci --no-audit --no-fund
          node copia-web.js
          npx cap sync android

      - name: Compila l'APK (GitHub) e l'AAB (Google Play)
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease bundleStoreRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/github/release/app-github-release.apk "$GITHUB_WORKSPACE/Radici.apk"
          cp app/build/outputs/bundle/storeRelease/app-store-release.aab "$GITHUB_WORKSPACE/Radici-store.aab"

      - name: Controlla che la versione per Google Play non abbia l'aggiornamento automatico
        working-directory: app-android/android/app/build
        run: |
          m=$(find intermediates -path '*storeRelease*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Manifest controllato: $m"
          test -n "$m"
          if grep -q REQUEST_INSTALL_PACKAGES "$m" || grep -qi fileprovider "$m"; then grep -n -i -E "REQUEST_INSTALL_PACKAGES|fileprovider" "$m" | head -5; echo "ERRORE: la versione store contiene l'aggiornamento automatico"; exit 1; fi
          if unzip -p "$GITHUB_WORKSPACE/Radici-store.aab" 'base/dex/*.dex' | grep -a -q 'Lit/radiciapp/prenota/AggiornaPlugin;'; then echo "ERRORE: AggiornaPlugin nella versione store"; exit 1; fi
          unzip -p "$GITHUB_WORKSPACE/Radici.apk" '*.dex' | grep -a -q 'Lit/radiciapp/prenota/AggiornaPlugin;' || { echo "ERRORE: manca AggiornaPlugin nell'APK di GitHub"; exit 1; }
          echo "OK: niente permesso di installazione, niente FileProvider, niente AggiornaPlugin"
          { echo "### Versione per Google Play"; echo "versionCode ${{ github.run_number }}, versionName 1.${{ github.run_number }}"; echo "Scarica l'artifact **Radici-aab-per-Google-Play** e caricalo nella Play Console."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Salva l'APK tra i file della compilazione
        uses: actions/upload-artifact@v4
        with:
          name: Radici-apk
          path: Radici.apk

      - name: Salva l'AAB per Google Play tra i file della compilazione
        uses: actions/upload-artifact@v4
        with:
          name: Radici-aab-per-Google-Play
          path: Radici-store.aab
          retention-days: 90

      - name: Salva il file di deoffuscamento (mapping.txt) per Google Play
        uses: actions/upload-artifact@v4
        with:
          name: Radici-mapping-per-Google-Play
          path: app-android/android/app/build/outputs/mapping/storeRelease/mapping.txt
          retention-days: 90

      - name: Pubblica l'APK firmato in Releases
        if: env.RADICI_KEY_PASSWORD != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.${{ github.run_number }}
          name: App Android 1.${{ github.run_number }}
          body: |
            App Android di Radici, versione 1.${{ github.run_number }}.
            Scarica Radici.apk dal telefono e installalo.
          files: Radici.apk
          make_latest: true
