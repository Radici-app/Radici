# Compila l'app per iPhone su un Mac di GitHub.
#  - Sempre: build di VERIFICA non firmata (controlla che il progetto si compili).
#  - Solo dal ramo main e solo se ci sono i segreti di Apple (APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID,
#    APPSTORE_API_KEY_P8, APPLE_TEAM_ID): build FIRMATA e caricata su App Store Connect / TestFlight.
#    La firma è automatica: con la chiave API Xcode crea e rinnova da solo certificato e profilo.
#    Vedi store/app-store/PASSI-QUANDO-APPLE-E-ATTIVO.md, sezione E.
name: App iPhone

on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'seed.js'
      - 'icone.js'
      - 'manifest.webmanifest'
      - '*.png'
      - 'app-android/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Serve Xcode 16.3 o più recente (Swift 6.1) per i pacchetti di Firebase
      - name: Scegli l'Xcode più recente
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Prepara l'app (copia il sito dentro l'app)
        working-directory: app-android
        run: |
          npm ci --no-audit --no-fund
          node copia-web.js
          npx cap sync ios

      - name: File di Firebase per iPhone (GoogleService-Info.plist)
        working-directory: app-android/ios/App/App
        run: |
          if [ ! -f GoogleService-Info.plist ]; then
            echo "::warning::Manca app-android/ios/App/App/GoogleService-Info.plist: uso un file finto, l'app compilata non funzionerebbe (va bene solo per la verifica)."
            cat > GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.da-sostituire</string>
            <key>BUNDLE_ID</key><string>it.radiciapp.prenota</string>
            <key>PROJECT_ID</key><string>radici-app</string>
          </dict></plist>
          EOF
          fi
          # Accesso con Google: lo schema dei link di ritorno è il REVERSED_CLIENT_ID del file di Firebase
          R=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" GoogleService-Info.plist)
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $R" Info.plist
          echo "Schema per l'accesso con Google: $R"

      - name: Compila (senza firma)
        working-directory: app-android/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          echo "### App iPhone compilata (verifica, non firmata) – versione 1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      # ---------- Build firmata per TestFlight (si attiva da sola quando ci sono i segreti di Apple) ----------
      - name: Chiave API di App Store Connect
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != '' && env.APPLE_TEAM_ID != ''
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "FIRMA=1" >> "$GITHUB_ENV"

      - name: Archivia e firma
        if: env.FIRMA == '1'
        working-directory: app-android/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Radici.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Carica su App Store Connect (TestFlight)
        if: env.FIRMA == '1'
        working-directory: app-android/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Radici.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          { echo "### Caricata su TestFlight: versione 1.${{ github.run_number }} (build ${{ github.run_number }})"; echo "Tra 10-30 minuti la trovi in App Store Connect → TestFlight."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Cancella la chiave API dal Mac
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Registro della compilazione (se qualcosa va storto)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-xcodebuild
          path: app-android/ios/App/*.log
