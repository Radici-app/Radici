<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomina a responsabile del trattamento</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4EE;--surf:#fff;--ink:#23271A;--mute:#6B705C;--line:#E2E2D5;--head:#2E3420;--acc:#8E9A55;--pri:#4F5A2A;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14160F;--surf:#1E2117;--ink:#EEF0E4;--mute:#AEB39B;--line:#33382A;--head:#E4E9CF;--acc:#B5C27A;--pri:#B5C27A;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Hanken Grotesk",system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}header img{width:44px;height:44px;border-radius:50%}
header b{display:block;font:400 1.4rem "Fraunces",serif;color:var(--head)}header span{color:var(--mute);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}nav a{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem}
nav a[aria-current="page"]{background:var(--pri);border-color:var(--pri);color:var(--bg)}
main{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:22px 22px 10px}
h1{font:400 1.8rem "Fraunces",serif;color:var(--head);margin:0 0 14px}
h3{font:400 1.15rem "Fraunces",serif;color:var(--head);margin:20px 0 6px}h3:first-of-type{margin-top:0}
p{margin:0 0 9px}p.li{padding-left:16px;position:relative}p.li::before{content:"•";position:absolute;left:2px;color:var(--acc)}
.bt{display:inline-block;margin:6px 0 14px;padding:12px 20px;border-radius:999px;background:var(--pri);color:var(--bg);font-weight:700;text-decoration:none}
footer{color:var(--mute);font-size:.82rem;margin-top:20px}

.avviso{background:#FFF4D6;border:1.5px solid #E5C766;color:#5A4600;border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:.92rem}
.bt{border:0;font:inherit;cursor:pointer}
@media print{body{background:#fff;color:#000;font-size:11.5pt}.w{max-width:none;padding:0}.noprint,nav,footer,header span{display:none!important}main{border:0;padding:0;background:#fff}h3{break-after:avoid}p{break-inside:avoid}}
</style>
</head>
<body>
<div class="w">
 <header><img id="lg" src="icon-192.png" alt=""><div><b id="nome"></b><span id="sotto"></span></div></header>
 <div class="avviso noprint"><b>Bozza di partenza.</b> Questo accordo va fatto verificare da un professionista prima di firmarlo. I dati delle parti si compilano da soli: se vedi "[da completare]", inseriscili nel gestionale (Negozio).</div>
 <button class="bt noprint" onclick="window.print()">Stampa o salva in PDF</button>
 <main><div id="testo"><p>Caricamento…</p></div></main>
 <footer>Documento generato dall'app di prenotazione, servizio Radix Salon.</footer>
</div>
<script src="seed.js"></script>
<script type="module">
/* Pagine pubbliche (senza accesso) per gli store: leggono gli stessi testi del gestionale (Negozio → Testi legali) */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MODELLO = "## Accordo di nomina a Responsabile del trattamento dei dati personali\n(art. 28 del Regolamento (UE) 2016/679 – GDPR)\n\n## Le parti\n**{{ragione}}**, con sede in {{indirizzo}}, P.IVA {{piva}}, email {{email}}, esercente dell'attività \"{{nome}}\" (di seguito \"Titolare\").\n**{{svil_nome}}**, P.IVA {{svil_piva}}, con sede in {{svil_sede}}, email {{svil_email}} (di seguito \"Responsabile\").\n\n## Premesse\n- Il Titolare usa l'app e il sito di prenotazione di {{nome}}, sviluppati e forniti dal Responsabile nell'ambito del servizio Radix Salon.\n- Per fornire il servizio il Responsabile tratta dati personali dei clienti del Titolare, per conto di quest'ultimo.\n- Le parti vogliono regolare il trattamento ai sensi dell'art. 28 GDPR.\n\n## 1. Oggetto e durata\nIl Titolare nomina il Responsabile per il trattamento dei dati personali necessari a fornire l'app e il sito di prenotazione. La nomina dura quanto il contratto di servizio tra le parti e cessa con esso.\n\n## 2. Natura e finalità del trattamento\nIl Responsabile conserva e gestisce account, prenotazioni, Fidelity Card, avvisi e notifiche e svolge manutenzione e assistenza tecnica. Non usa i dati per finalità proprie.\n\n## 3. Interessati e tipi di dati\n- Interessati: i clienti del Titolare che usano l'app o il sito.\n- Dati: nome, cognome, email, numero di telefono, foto del profilo (facoltativa), prenotazioni (servizi, operatore, data, ora, note), punti Fidelity, codice del dispositivo per le notifiche (se attivate), data di accettazione di Termini e Informativa.\n- Non sono trattati dati appartenenti a categorie particolari.\n\n## 4. Istruzioni del Titolare\nIl Responsabile tratta i dati solo su istruzione documentata del Titolare, compreso il presente accordo e le funzioni del gestionale, salvo obblighi di legge. In tal caso informa il Titolare prima del trattamento, se la legge lo consente.\n\n## 5. Riservatezza\nIl Responsabile garantisce che le persone autorizzate al trattamento siano vincolate alla riservatezza.\n\n## 6. Sicurezza\nIl Responsabile adotta misure tecniche e organizzative adeguate (art. 32 GDPR), tra cui: accesso protetto da autenticazione, regole che limitano l'accesso ai dati al singolo cliente e al personale del Titolare, comunicazioni cifrate e accesso del proprio personale limitato a manutenzione e assistenza.\n\n## 7. Altri responsabili\nIl Titolare autorizza in via generale il ricorso a: Google Ireland Limited (Google Firebase: accessi e archiviazione dei dati, in data center nell'Unione Europea) e GitHub, Inc. (pubblicazione del sito e dei file dell'app). Il Responsabile informa il Titolare di eventuali modifiche, che il Titolare può contestare, e impone agli altri responsabili obblighi equivalenti a questi.\n\n## 8. Trasferimenti fuori dall'Unione Europea\nEventuali trasferimenti avvengono solo nel rispetto del capo V GDPR, ad esempio sulla base del Data Privacy Framework UE-USA o delle clausole contrattuali standard.\n\n## 9. Diritti degli interessati\nIl Responsabile assiste il Titolare nel rispondere alle richieste degli interessati e gli inoltra senza ritardo quelle che riceve direttamente.\n\n## 10. Violazioni dei dati\nIl Responsabile informa il Titolare senza ingiustificato ritardo, e comunque entro 48 ore da quando ne è venuto a conoscenza, di ogni violazione dei dati personali, con le informazioni disponibili.\n\n## 11. Ulteriore assistenza\nIl Responsabile assiste il Titolare, per quanto di competenza, negli obblighi di sicurezza, di valutazione d'impatto e di consultazione dell'Autorità.\n\n## 12. Cancellazione o restituzione\nAl termine del servizio il Responsabile, a scelta del Titolare, cancella o restituisce i dati e ne cancella le copie, salvo obblighi di legge, entro 30 giorni dalla richiesta.\n\n## 13. Verifiche\nIl Responsabile mette a disposizione le informazioni necessarie a dimostrare il rispetto di questo accordo e consente verifiche ragionevoli, con preavviso.\n\n## 14. Legge applicabile\nIl presente accordo è regolato dalla legge italiana. Per quanto non previsto valgono il contratto di servizio e il GDPR.\n\n## Firme\nLuogo e data: ______________________________\nPer il Titolare ({{ragione}}), il legale rappresentante: ______________________________\nPer il Responsabile ({{svil_nome}}), il legale rappresentante: ______________________________";
const md = t => t.split('\n').map(r => r.trim()).filter(Boolean).map(r => {
  const it = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return r.startsWith('## ') ? `<h3>${it(r.slice(3))}</h3>` : r.startsWith('- ') ? `<p class="li">${it(r.slice(2))}</p>` : `<p>${it(r)}</p>`;
}).join('');
function mostra(C) {
  document.getElementById('nome').textContent = C.nome || '';
  document.getElementById('sotto').textContent = C.sottotitolo || '';
  if (C.logo) document.getElementById('lg').src = C.logo;
  document.title = 'Nomina a responsabile del trattamento – ' + (C.nome || '');
  document.getElementById('testo').innerHTML = md(window.compilaLegale(MODELLO, C));
}
const base = JSON.parse(JSON.stringify(window.RADICI_SEED));
try {
  const db = getFirestore(initializeApp({ apiKey: 'AIzaSyCUhd6pXSheUQ6gPhT5OfvprM5dYI2uxz4', authDomain: 'radici-app.firebaseapp.com', projectId: 'radici-app', storageBucket: 'radici-app.firebasestorage.app', messagingSenderId: '602201707324', appId: '1:602201707324:web:88d8681280de279b81c439' }));
  const s = await getDoc(doc(db, 'saloni', 'radici'));
  mostra(Object.assign(base, s.exists() ? s.data() : {}));
} catch (e) { mostra(base); } /* senza connessione a Firebase mostra il testo standard */
</script>
</body>
</html>
